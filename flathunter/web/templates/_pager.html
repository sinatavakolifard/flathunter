{% if pagination.enabled %}
  <nav class="pager">
    {% if pagination.has_prev %}
      <a class="pager-btn" href="{{ url_for(pagination.endpoint, page=pagination.prev_page) }}">← Newer</a>
    {% else %}
      <span class="pager-btn disabled">← Newer</span>
    {% endif %}
    <span class="pager-info">
      Page {{ pagination.page }}{% if pagination.max_pages %} of {{ pagination.max_pages }}{% endif %}
    </span>
    {% if pagination.has_next %}
      <a class="pager-btn" href="{{ url_for(pagination.endpoint, page=pagination.next_page) }}">Older →</a>
    {% else %}
      <span class="pager-btn disabled">Older →</span>
    {% endif %}
  </nav>
{% endif %}
