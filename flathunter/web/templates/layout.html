<!doctype html>
<html lang="en">
  <head>
    <title>{% block title %}{% endblock %} · Wohnungssuche</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="apple-touch-icon" sizes="152x152" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <meta name="theme-color" content="#0d1117">
  </head>
  <body data-view="{% block view %}{% endblock %}">
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">
          <span class="brand-mark">⌂</span>
          Wohnungssuche
        </a>
        <nav class="site-nav">
          <a href="/" {% if request.path == '/' or request.path == '/index' %}class="active"{% endif %}>Listings</a>
          <a href="/starred" {% if request.path == '/starred' %}class="active"{% endif %}>Starred</a>
          <a href="/about" {% if request.path == '/about' %}class="active"{% endif %}>About</a>
          <a href="/resources" {% if request.path == '/resources' %}class="active"{% endif %}>Tenant rights</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      {% for message in get_flashed_messages() %}
        <div class="callout"><p>{{ message }}</p></div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>Running locally · no accounts, no analytics, no third-party scripts</span>
        <span>{% block footer_note %}{% endblock %}</span>
      </div>
    </footer>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
